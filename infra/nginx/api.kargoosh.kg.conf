# API Loko под доменом kargoosh.kg — проксирует на тот же backend (127.0.0.1:8000).
# DNS у hoster.kg (без Cloudflare) → TLS через certbot: он сам добавит listen 443 + редирект.
#   sudo cp infra/nginx/api.kargoosh.kg.conf /etc/nginx/sites-available/api.kargoosh.kg
#   sudo ln -sf /etc/nginx/sites-available/api.kargoosh.kg /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.kargoosh.kg -d panel.kargoosh.kg --redirect --agree-tos -m you@kargoosh.kg --no-eff-email
server {
    listen 80;
    listen [::]:80;
    server_name api.kargoosh.kg;
    client_max_body_size 25m;

    location /media/ { alias /srv/loko/media/; access_log off; expires 7d; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
