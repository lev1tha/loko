# Рабочее место сотрудников (SPA Loko) под доменом kargoosh.kg.
# Отдаёт отдельную сборку SPA, собранную под API api.kargoosh.kg (см. ниже).
# DNS у hoster.kg (без Cloudflare) → TLS через certbot (вместе с api.kargoosh.kg).
#   sudo cp infra/nginx/panel.kargoosh.kg.conf /etc/nginx/sites-available/panel.kargoosh.kg
#   sudo ln -sf /etc/nginx/sites-available/panel.kargoosh.kg /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сборка SPA именно под этот домен (API → api.kargoosh.kg), вывод в /srv/www/kargoosh-panel:
#   sudo mkdir -p /srv/www/kargoosh-panel && sudo chown -R "$USER" /srv/www/kargoosh-panel
#   cd /opt/loko/infra
#   VITE_API_BASE_URL=https://api.kargoosh.kg/api WEB_DIR=/srv/www/kargoosh-panel \
#     docker compose --profile build run --rm --build frontend
server {
    listen 80;
    listen [::]:80;
    server_name panel.kargoosh.kg;

    root /srv/www/kargoosh-panel;
    index index.html;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
